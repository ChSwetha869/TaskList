<h1>TASK MANAGEMENT</h1>
<form [formGroup]="taskManagementForm" (ngSubmit)="onSubmit()">
  <div>
    <label for="title">Title:</label>
    <input type="text" id="title" formControlName="title" placeholder="Enter title" required>
  </div>
  <div>
    <label for="description">Description:</label>
    <input type="text" id="description" formControlName="description" placeholder="Enter description" required>
  </div>
  <button type="submit">Submit</button>
</form>

<div class="stored-data" *ngIf="data.length > 0">
  <h4>Task Management Stored Data</h4>
  <div *ngFor="let item of data">
    {{ item.title }} : {{ item.description }}
  </div>
</div>
